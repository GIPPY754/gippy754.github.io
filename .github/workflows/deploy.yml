name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A5AACC: ${{ secrets.A5AACC }}
          BD7AB3: ${{ secrets.BD7AB3 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A5AACC', '')
          bm = os.environ.get('BD7AB3', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 8d6e73ab83883149dcea58f94604b795ea0e -->', gm)
          if bm:
              s2 = s2.replace('<!-- d2e13f19be70deea6ad3f943183baa7e -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
